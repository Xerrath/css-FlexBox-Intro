<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Flex Box Learning">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="./global.css" type="text/css">
    </head>

    <body>
        <header>
            <h1>Using Flex box</h1>
        </header>
        
        <main>
            <section>
                <h2>Flex Box In a Column and Row with Space</h2>
                <div id="secOneDivWrap">
                    <div class="red square">1</div>
                    <div class="blue square">2</div>
                    <div class="purple square">3</div>
                    <div class="yellow square">4</div>
                </div>
            </section>
            
            <section>
                <h2>Using Flex Box In Column Reverse and Row with Space</h2>
                <div id="secTwoDivWrap">
                    <div class="red square">1</div>
                    <div class="blue square">2</div>
                    <div class="purple square">3</div>
                    <div class="yellow square">4</div>
                </div>
            </section>

            <div id="displayWrapper">
                <section class="columnWrappers">
                    <h2>Using Flex Box Row and then Column with Space</h2>
                    <div id="secThreeDivWrap">
                        <div class="red square">1</div>
                        <div class="blue square">2</div>
                        <div class="purple square">3</div>
                        <div class="yellow square">4</div>
                    </div>
                </section>

                <section class="columnWrappers">
                    <h2>Using Flex Box Row and then Column Reverse with Space</h2>
                    <div id="secFourDivWrap">
                        <div class="red square">1</div>
                        <div class="blue square">2</div>
                        <div class="purple square">3</div>
                        <div class="yellow square">4</div>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
