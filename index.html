<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Flex Box Learning">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <header>
            <h1>Using Flex box</h1>
        </header>
        
        <main>
            <h2>Flex Box In a Column and Row</h2>
            <section>
                    <div id="secOneDivWrap">
                        <div style="background-color: red; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: blue; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: purple; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: yellow; width:150px; height:150px; border: 2px solid black"></div>
                    </div>
            </section>
            
            <section>
                <h2>Using Flex Box In Column Revers and Row</h2>
                <div id="secTwoDivWrap">
                        <div style="background-color: red; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: blue; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: purple; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: yellow; width:150px; height:150px; border: 2px solid black"></div>
                </div>
            </section>

            <section>
                <h2>Using Flex Box Row and then Column</h2>
                <div id="secThreeDivWrap">
                        <div style="background-color: red; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: blue; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: purple; width:150px; height:150px; border: 2px solid black"></div>
                        <div style="background-color: yellow; width:150px; height:150px; border: 2px solid black"></div>
                </div>
            </section>
        </main>
    </body>
</html>
